version: 2
updates:
  - package-ecosystem: gomod
    target-branch: staging
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    target-branch: staging
    directory: /internal/controlplane/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    target-branch: staging
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        update-types:
          - minor
          - patch
