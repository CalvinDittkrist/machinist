[server]
listen = "127.0.0.1:7331"
database = "~/.machinist/server/machinist.db"
worker_token_file = "~/.machinist/server/worker.token"
# max_concurrent_jobs = 1

# Quota-aware admission keeps runs queued until the worker reports fresh,
# sufficient provider quota. "disabled" preserves capability-only scheduling.
# See docs/quota.md for the estimate and reserve semantics.
[server.quota]
enforcement = "disabled"
minimum_reserve_percent = 20
safety_reserve_percent = 5
minimum_samples = 3
max_observation_age = "3m"
check_interval = "1m"

[commands.foreman]
executor = "codex"
prompt_file = "prompts/foreman.md"
timeout = "120m"

[commands.audit]
executor = "codex"
prompt_file = "prompts/audit.md"
timeout = "60m"

[commands.shepherd]
executor = "codex"
prompt_file = "prompts/shepherd.md"
timeout = "120m"

# Schedule Shepherd for one configured repository with a trigger like this:
# [github.repositories]
# my-project = "owner/my-project"
#
# [triggers.cron.shepherd-my-project]
# schedule = "*/30 * * * *"
# timezone = "UTC"
# repository = "my-project"
# command = "shepherd"
# prompt = "Run the Shepherd queue for my-project with max_actions=3. Perform at most 3 mutating actions in this run."
